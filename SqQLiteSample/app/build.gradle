plugins { id 'com.android.application' }
// The namespace ties generated resource IDs to this lesson's Java package.
android {
    namespace 'practice.bucky.lessonsqlite'
    compileSdk 35
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig { testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'; applicationId 'practice.bucky.lessonsqlite'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0' }
}

dependencies {
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
